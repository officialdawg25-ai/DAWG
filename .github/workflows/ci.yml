name: DAWG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit report
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const r=require('/tmp/npm-audit.json'); console.log(JSON.stringify({summary:r.metadata?.vulnerabilities, vulnerabilities:Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))"
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
